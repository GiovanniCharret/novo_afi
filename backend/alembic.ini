# Alembic configuration — F2 (2026-05-07).
# A URL real do banco vem de DATABASE_URL via alembic/env.py.
# Esta configuração é mínima: alembic só precisa do script_location e do
# template de version files. Logging usa o config padrão do alembic.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url é sobrescrita em alembic/env.py via get_database_url().
# Não usar este valor — está aqui só para alembic não reclamar.
sqlalchemy.url = driver://user:pass@host/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
