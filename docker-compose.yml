services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: novo_afi_backend
    working_dir: /app/backend
    command: uvicorn app.server:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      # Defaults preservam o comportamento de dev local. Em produção, criar
      # `.env` ao lado deste docker-compose.yml com os valores reais — o
      # compose lê automaticamente. F1 (2026-05-13) adicionou as envs SMTP
      # e PUBLIC_BASE_URL.
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://novo_afi:novo_afi@db:5432/novo_afi}
      SESSION_SECRET: ${SESSION_SECRET:-recebedor-nfs-dev-secret}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      # F1 — SMTP (vazio em dev → cai no stub do email_service).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      POPLLER_PATH: /usr/bin
      TESSERACT_CMD: ""
    volumes:
      - ./backend:/app/backend
      # F8a B5: contrato_config.py espera base_contratos.json ao lado dele;
      # arquivo real fica na raiz do projeto. Mount read-only resolve sem
      # alterar contrato_config.py (regra de preservação do parser DEV).
      # F2 vai ler da raiz também — fonte de verdade única.
      - ./base_contratos.json:/app/backend/app/base_contratos.json:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: novo_afi_db
    environment:
      POSTGRES_DB: novo_afi
      POSTGRES_USER: novo_afi
      POSTGRES_PASSWORD: novo_afi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novo_afi -d novo_afi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
